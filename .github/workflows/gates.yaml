name: Gates
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  protected-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Block agent changes to gate files
        if: startsWith(github.head_ref, 'claude/') && !contains(github.event.pull_request.labels.*.name, 'gilde:allow-protected')
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          BLOCKED=$(echo "$CHANGED" | grep -E '^(\.github/|\.claude/|AGENTS\.md|CLAUDE\.md|apps/api/src/job/job-state\.ts|apps/api/src/.*migrations/)' || true)
          if [ -n "$BLOCKED" ]; then echo "Agent PR touches protected paths:"; echo "$BLOCKED"; exit 1; fi
