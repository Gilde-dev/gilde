name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  protected-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Block agent changes to gate files
        if: startsWith(github.head_ref, 'claude/') && !contains(github.event.pull_request.labels.*.name, 'gilde:allow-protected')
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          BLOCKED=$(echo "$CHANGED" | grep -E '^(\.github/|AGENTS\.md|CLAUDE\.md|src/job/job-state\.ts|src/.*migrations/)' || true)
          if [ -n "$BLOCKED" ]; then echo "Agent PR touches protected paths:"; echo "$BLOCKED"; exit 1; fi