# Reviews a PR with Claude Code when it has the `gilde:review` label (opt-in, any PR, also human ones).
# Adding the label starts a review; while the label is present, new pushes, reopen and ready-for-review re-review it.
# Remove the label to stop. Other labels never trigger a review. Draft PRs are skipped.
# The review prompt is .github/agent-review.md (a protected path, so agents cannot change their reviewer).
# Auth: the CLAUDE_CODE_OAUTH_TOKEN secret (claude setup-token), so runs use the Claude subscription.
name: Agent review
on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft && (
        (github.event.action == 'labeled' && github.event.label.name == 'gilde:review') ||
        (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'gilde:review'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Base branch: ${{ github.event.pull_request.base.ref }}. Head commit: ${{ github.event.pull_request.head.sha }}.
            Read .github/agent-review.md first and follow it exactly.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
