# Syncs managed skills from Gilde-dev/gildeboek into .claude/skills/ (template: gildeboek/templates/sync-skills.yaml).
# Which skills this repo gets is configured in .gilde.json.
name: Sync Gilde skills
on:
  schedule: [{ cron: '17 6 * * *' }]   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.gilde.json]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Gilde-dev/gildeboek
          path: .gildeboek
          fetch-depth: 0

      - name: Sync managed skills
        run: |
          bash .gildeboek/scripts/sync.sh .gildeboek .
          rm -rf .gildeboek

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: gilde/sync-skills
          title: "Sync skills from gildeboek"
          commit-message: "chore: sync skills from gildeboek"
          body: |
            Updates managed skills from Gilde-dev/gildeboek, as configured in `.gilde.json`.
            Managed skills have a `managed-by: gildeboek@<sha>` line in their frontmatter; change those in gildeboek, not here.
            Skills without that line belong to this repo and are never touched by the sync.
