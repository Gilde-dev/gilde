# Builds the api, web and channels images.
# Pull requests: build only, nothing is pushed, so a broken Dockerfile shows up before merge.
# Main: push to GHCR only after CI succeeded on that exact commit (workflow_run), tagged with the commit SHA and latest.
# There is no deploy step: deploying is done by a human from the gilde-infra repo.
name: Images
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image ${{ matrix.app }}
    # workflow_run: only a push to main whose CI run succeeded. workflow_dispatch: only from main.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, channels]
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/gilde-dev/gilde-${{ matrix.app }}:${{ env.SHA }}
            ghcr.io/gilde-dev/gilde-${{ matrix.app }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
